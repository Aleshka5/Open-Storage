name: auth-gateway

# One namespace: one network, one env file, one compose file. The proxy is not
# here on purpose: it runs as the host's systemd Caddy, because its config lives
# at /etc/caddy/Caddyfile and two of its upstreams are host loopback ports
# (ADR-0005). This file covers the gateway, the idp, its database, and the page.
# gateway and resume are published images. See docs/images.md.

networks:
  open_network:
    name: open_network
  # Product networks, named by the gateway's upstreams. An extra network is extra
  # attack surface, so the gateway joins only these.
  models_network:
    external: true
  # Created by the rag namespace. See ADR-0009 and ADR-0011.
  rag_network:
    external: true
    name: rag_network
  # Created by deploy/audio. The gateway reaches audio-api:8000 and frontend:80 here.
  audio_network:
    external: true
  deploy_auth_network:
    external: true

volumes:
  idp_pgdata:

services:
  gateway:
    image: ${REGISTRY:?REGISTRY is required}/auth-gateway/gateway:${IMAGE_TAG:-latest}
    build:
      context: ../../src/auth-gateway/gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_CONFIG: /etc/gateway/config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Overridable so a stand can use a different host set without editing the
      # committed contract file.
      - ${GATEWAY_CONFIG_FILE:-../../src/auth-gateway/gateway/config.yaml}:/etc/gateway/config.yaml:ro
    ports:
      # Caddy on the host reaches the gateway here; nothing else does. The port is
      # overridable so a parallel stand can run beside the live one.
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      # Metrics are on their own listener, published to host loopback only.
      # Host port 9000 belongs to MinIO, hence 19000 by default.
      - "127.0.0.1:${METRICS_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 160m
    depends_on:
      idp:
        condition: service_started
    networks:
      - open_network
      - models_network
      - rag_network
      - audio_network
      - deploy_auth_network

  idp:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    # No --optimized: it is refused on a first-ever start (the image must be built
    # first, which `start` does itself). The first start therefore takes ~60s.
    command: ["start", "--import-realm"]
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://idp_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDP_DB_PASSWORD}
      KC_HOSTNAME: https://id.filenkov.store
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # An empty database only. Remove these two from .env after the first start.
      KEYCLOAK_ADMIN: ${IDP_BOOTSTRAP_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${IDP_BOOTSTRAP_PASSWORD}
      # realm.json refers to these by name; the file commits no secret.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET}
      IDP_ADMIN_SECRET: ${IDP_ADMIN_SECRET}
    volumes:
      - ../../src/auth-gateway/idp/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ../../src/auth-gateway/idp/theme/filenkov:/opt/keycloak/themes/filenkov:ro
    mem_limit: 1g
    depends_on:
      idp_db:
        condition: service_healthy
    networks:
      - open_network

  idp_db:
    image: docker.io/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDP_DB_PASSWORD}
    volumes:
      - idp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    networks:
      - open_network

  resume:
    image: ${REGISTRY:?REGISTRY is required}/auth-gateway/resume:${IMAGE_TAG:-latest}
    build:
      context: ../../src/auth-gateway/resume-page
    restart: unless-stopped
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - open_network
