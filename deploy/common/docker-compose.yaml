name: common

# Shared data services. Names, images, network and env keys match
# Common docker-compose-common.yml and .env.common.
# Decision: adrs/8-common-data-services.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - common_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - common_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    restart: unless-stopped
    # The data dir lives on /dev/sda1 (/media/aleksey/HardDisk). fstab has
    # `nofail`, so a missing disk would bind-mount an empty dir. Fail instead.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/.minio.sys/format.json ]; then
          echo "FATAL: /data does not look like the MinIO data disk (disk not mounted?)" >&2
          exit 1
        fi
        exec minio server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - /media/aleksey/HardDisk/minio:/data
    networks:
      - common_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      common_network:
        aliases:
          - rabbit

  # One MongoDB for every product on common_network. Each product keeps its own
  # database. container_name is the DNS name consumers use.
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks:
      - common_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  common_network:
    name: common_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
