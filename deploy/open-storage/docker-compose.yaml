name: open-storage

# App only. Postgres, Redis, MinIO, RabbitMQ and Mongo are the common
# namespace on common_network. See adrs/8-common-data-services.md and
# docs/open-storage/adrs/3-app-on-common-data.md.
# open_network is created by the auth-gateway namespace.

networks:
  open_network:
    external: true
    name: open_network
  common_network:
    external: true
    name: common_network

services:
  app:
    build:
      context: ../../src/open-storage
      dockerfile: ../../deploy/open-storage/app/Dockerfile
    container_name: open-storage-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      SPA_STATIC_DIR: /opt/spa
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      open_network:
        aliases:
          - app
          - open-storage-app
      common_network: {}
