name: open-storage

# One namespace: one network, one env file, one compose file. The namespace owns
# its own Postgres, MinIO and Redis; it no longer borrows them from Common.
# The gateway fronts this app on open_network, so :8000 is never published.

networks:
  # Shared with the auth-gateway namespace: the gateway reaches the app here by
  # its container alias. Do not rename it without changing the gateway upstream.
  open_network:
    external: true
    name: open_network
  # Optional. Off by default (RAG_ENABLED=false). Join it only when RAG indexing
  # is turned on; see rag_edge below.
  rag_edge:
    external: true
    name: rag_edge

volumes:
  postgres_data:
  # Question open, not decided here: the legacy stand kept MinIO objects on the
  # host disk /media/aleksey/HardDisk/minio. Whether this namespace keeps its own
  # named volume or reuses that host disk is undecided; see report.
  minio_data:

services:
  app:
    build:
      context: ../../src/open-storage
      dockerfile: app/Dockerfile
    container_name: open-storage-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://storage:${POSTGRES_PASSWORD}@open-storage-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://open-storage-redis:6379
      S3_ENDPOINT_URL: http://open-storage-minio:9000
    # No ports: the gateway is the only way in.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      open_network:
        aliases:
          - open-storage-app
      # Uncomment together with RAG_ENABLED=true in .env. Joining it while RAG is
      # off widens the attack surface for no reason.
      # rag_edge: {}

  postgres:
    # Version matched to the Postgres the namespace borrows today (stand: 16-alpine).
    image: docker.io/library/postgres:16-alpine
    container_name: open-storage-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      open_network:
        aliases:
          - open-storage-postgres

  minio:
    # Version matched to the MinIO the namespace borrows today.
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: open-storage-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      # The image ships no mc/curl/wget; minio speaks HTTP and answers /minio/health/live.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'HEAD /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      open_network:
        aliases:
          - open-storage-minio

  redis:
    # Version matched to the Redis the namespace borrows today.
    image: docker.io/library/redis:7-alpine
    container_name: open-storage-redis
    restart: unless-stopped
    # Session state store: survive a restart of the container.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      open_network:
        aliases:
          - open-storage-redis
