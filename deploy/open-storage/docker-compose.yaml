name: open-storage

# One namespace: one network, one env file, one compose file.
# open_network is created by the auth-gateway namespace. See
# docs/open-storage/adrs/1-own-data-on-open-network.md.

networks:
  open_network:
    external: true
    name: open_network

volumes:
  open-storage-postgres-data:
    name: open-storage-postgres-data
  open-storage-redis-data:
    name: open-storage-redis-data
  open-storage-rabbitmq-data:
    name: open-storage-rabbitmq-data
  open-storage-mongo-data:
    name: open-storage-mongo-data
  open-storage-minio-data:
    name: open-storage-minio-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MINIO_DATA_PATH:?MINIO_DATA_PATH is required}

services:
  app:
    build:
      context: ../../src/open-storage
      dockerfile: ../../deploy/open-storage/app/Dockerfile
    container_name: open-storage-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@open-storage-postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://open-storage-redis:6379
      S3_ENDPOINT_URL: http://open-storage-minio:9000
      SPA_STATIC_DIR: /opt/spa
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      open_network:
        aliases:
          - app
          - open-storage-app

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: open-storage-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - open-storage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      open_network:
        aliases:
          - open-storage-postgres

  minio:
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: open-storage-minio
    restart: unless-stopped
    # Same 9000/9001 the shared MinIO published: consumers reach it by the
    # open-storage-minio name on open_network, the console stays on the host.
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - open-storage-minio-data:/data
    # The host directory is owned by the deploy user; under rootless podman the
    # container only maps that owner as uid 0, so MinIO runs as root inside the
    # container. Host-side ownership of the MinIO data root stays the deploy
    # user's, which is what a host-side backup tool needs.
    user: "0:0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      open_network:
        aliases:
          - open-storage-minio

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: open-storage-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - open-storage-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      open_network:
        aliases:
          - open-storage-redis

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    container_name: open-storage-rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - open-storage-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      open_network:
        aliases:
          - open-storage-rabbitmq

  mongo:
    image: docker.io/library/mongo:7
    container_name: open-storage-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - open-storage-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      open_network:
        aliases:
          - open-storage-mongo
