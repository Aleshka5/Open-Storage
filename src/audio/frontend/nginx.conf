# nginx: serves the SPA. All `/api/*` and `/fonts/*` are routed upstream (gateway);
# here there is only static content and a fallback to index.html for client-side routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fonts are cached long-term; static assets — briefly.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
