# nginx serves the SPA. The gateway sends /api/* to audio-api. This server
# keeps the page, the fonts, and the fallback to index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
