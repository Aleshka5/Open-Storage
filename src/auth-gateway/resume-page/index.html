<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <script>
      var KEY = 'theme.preference'

      function readPreference() {
        try {
          var jar = document.cookie || ''
          var parts = jar.split(';')
          for (var i = 0; i < parts.length; i++) {
            var part = parts[i].trim()
            var eq = part.indexOf('=')
            if (eq === -1) continue
            if (part.slice(0, eq) !== KEY) continue
            var stored = part.slice(eq + 1)
            if (stored === 'light' || stored === 'dark' || stored === 'system') return stored
            return 'dark'
          }
        } catch (e) {}
        return 'dark'
      }

      function resolve(preference) {
        if (preference === 'light' || preference === 'dark') return preference
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      }

      function apply(preference) {
        var theme = resolve(preference)
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme === 'light' ? 'light' : 'dark'
        var meta = document.querySelector('meta[name="color-scheme"]')
        if (meta) meta.content = root.style.colorScheme
      }

      apply(readPreference())

      var schemeMedia = window.matchMedia('(prefers-color-scheme: light)')
      function onSchemeChange() {
        if (readPreference() === 'system') apply(readPreference())
      }
      if (schemeMedia.addEventListener) schemeMedia.addEventListener('change', onSchemeChange)
      else if (schemeMedia.addListener) schemeMedia.addListener(onSchemeChange)
    </script>
    <title>Alexey Filenkov · Senior AI Agents</title>
    <meta
      name="description"
      content="Resume of Alexey Filenkov, Senior AI Agents engineer: LangGraph, RAG, MCP, FastAPI, Go. Walk the tree instead of scrolling."
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
