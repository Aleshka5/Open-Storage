server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The image runs nginx in the container locale, where the default Date
    # header is not English. rag-edge forwards upstream headers byte for byte,
    # and an ASCII Date is the contract every hop downstream assumes.
    charset utf-8;
    server_tokens off;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
        }
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
